name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Upload the built distributions to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check_version:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compare package version with the tag
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import re; print(re.search(r'^__version__ = \"([^\"]+)\"', open('upal/__init__.py').read(), re.M).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || { echo "release tag must point at origin/main"; exit 1; }

  tests:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-14
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install UPAL with tests and line detection
        run: python -m pip install ".[lines,test]"
      - name: Run tests
        run: python -m pytest -v

  build:
    name: Build wheel and source distribution
    needs: check_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and inspect distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify the built wheel
        run: |
          python -m pip install ".[lines,test]"
          python -m pip uninstall -y upal
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import importlib.metadata, upal; assert upal.__version__ == importlib.metadata.version('upal')"
      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  prepare_hub:
    name: Build and verify Hub model folder
    needs: [tests, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - name: Install the built wheel artifact
        run: python -m pip install dist/*.whl
      - name: Convert and verify using the installed wheel
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/push_to_hub.py" --output "$RUNNER_TEMP/hub/upal"
      - uses: actions/upload-artifact@v6
        with:
          name: hub-model
          path: ${{ runner.temp }}/hub/upal
          if-no-files-found: error

  publish_testpypi:
    name: Publish to TestPyPI
    needs: [tests, build, prepare_hub]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish_pypi:
    name: Publish to PyPI
    needs: [tests, build, prepare_hub]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish_hub:
    name: Publish model to Hugging Face Hub
    needs: [tests, build, prepare_hub, publish_pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: huggingface
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/download-artifact@v7
        with:
          name: hub-model
          path: hub-model
      - run: python -m pip install "huggingface_hub>=0.30"
      - name: Upload the pre-verified model folder
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/push_to_hub.py --output hub-model --push --upload-only --repo-id rkreft/upal
